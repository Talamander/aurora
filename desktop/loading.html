<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Aurora</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; color: #eef0f6; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-app-region: drag; user-select: none; }
  main { height: 100%; display: grid; place-items: center; text-align: center; }
  .mark { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 22px; position: relative; background: radial-gradient(circle at 30% 25%, rgba(255,154,106,.45), transparent 70%), #0e1016; box-shadow: 0 0 0 1px #1c1f29, 0 24px 80px -20px rgba(255,122,156,.35); }
  .mark i { position: absolute; left: 17px; height: 5px; border-radius: 3px; }
  .mark i:nth-child(1) { top: 22px; width: 38px; background: #eef0f6; }
  .mark i:nth-child(2) { top: 33px; width: 29px; background: #868e9c; }
  .mark i:nth-child(3) { top: 44px; width: 20px; background: #4a505b; }
  .mark b { position: absolute; right: 14px; top: 41px; width: 11px; height: 11px; border-radius: 50%; background: linear-gradient(135deg, #ffc56b, #ff7a9c 55%, #a69bff); animation: glow 1.6s ease-in-out infinite; }
  h1 { margin: 0 0 6px; font-weight: 680; font-size: 22px; letter-spacing: -0.035em; }
  p { margin: 0; color: #868e9c; }
  .err:empty { display: none; }
  .err { color: #ff9a8a; max-width: 460px; margin: 12px auto 0; user-select: text; -webkit-app-region: no-drag; }
  @keyframes glow { 50% { transform: scale(1.35); filter: brightness(1.25); } }
  @media (prefers-reduced-motion: reduce) { .mark b { animation: none; } }
</style>
</head>
<body>
<main>
  <div>
    <div class="mark"><i></i><i></i><i></i><b></b></div>
    <h1>Aurora</h1>
    <p id="status">Waking up your feeds…</p>
    <p class="err" id="error"><!--ERROR--></p>
  </div>
</main>
<script>
  if (document.getElementById('error').textContent.trim()) document.getElementById('status').textContent = 'Aurora could not start.';
</script>
</body>
</html>
